name: rima
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.26.4
  - scipy
  - scikit-learn=1.3.0
  - pandas=1.5.3
  - matplotlib
  - pillow
  - tqdm
  - pip:
    - torchmetrics==1.3.0
    - jax
    - jaxlib
    - jaxopt==0.8.3
    - jaxtyping
    - einops==0.8.0
    - flax==0.8.5
    - equinox==0.11.5
    - lineax==0.0.7
